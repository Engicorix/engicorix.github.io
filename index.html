<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ENGICORIX — Core Competencies</title>
<style>
:root{
  --bg:#080d14;--bg2:#0d1520;--bg3:#121d2e;--border:#1e2f45;
  --text:#e2ecf8;--muted:#4a6080;
  --om:#e8881a;--om-l:#1a1008;--om-b:#3a2010;
  --epc:#2288e8;--epc-l:#080f1e;--epc-b:#102040;
  --dt:#18c870;--dt-l:#061410;--dt-b:#0a2818;
  --hub:#58c8f8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'MICEGothic','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  display:flex;flex-direction:column}

.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px;background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;position:relative;min-height:46px}
.hdr img{height:27px;filter:brightness(1.1)}
.hdr-mid{position:absolute;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:600;white-space:nowrap}
.filters{display:flex;gap:5px}
.fb{padding:4px 12px;border-radius:999px;font-family:inherit;font-size:11px;
  font-weight:700;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--muted);transition:all .2s}
.fb:hover{color:var(--text);border-color:#3a5070}
.fb.a-all{background:#1e2f45;border-color:#3a5070;color:#fff}
.fb.a-om{background:var(--om-b);border-color:var(--om);color:var(--om)}
.fb.a-epc{background:var(--epc-b);border-color:var(--epc);color:var(--epc)}
.fb.a-dt{background:var(--dt-b);border-color:var(--dt);color:var(--dt)}

.layout{display:flex;flex:1;overflow:hidden}
.gwrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;cursor:default}

/* SIDEBAR */
.sb{width:222px;flex-shrink:0;background:var(--bg2);
  border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-sec{padding:12px 13px;border-bottom:1px solid var(--border)}
.sb-ttl{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:9px}

/* 종합건설면허 */
.lic{background:linear-gradient(135deg,#0d1a30,#102240);
  border:1px solid #2a4878;border-radius:9px;padding:9px 11px;margin-bottom:0}
.lic-t{font-size:10.5px;font-weight:900;color:#ffd060;margin-bottom:5px;
  display:flex;align-items:center;gap:4px}
.lic ul{list-style:none;padding:0}
.lic li{font-size:9.5px;color:rgba(255,255,255,.75);padding:1.5px 0 1.5px 11px;
  position:relative;line-height:1.4}
.lic li::before{content:'▸';position:absolute;left:0;color:#ffd060;font-size:8px}

/* Expert Pool */
.pool{background:linear-gradient(135deg,#0d1a30,#142050);
  border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:8px;margin-bottom:7px;
  border:1px solid #1a3060}
.pool-n{font-size:24px;font-weight:900;color:#fff;line-height:1}
.pool-ns{font-size:14px}
.pool-r{display:flex;flex-direction:column}
.pool-l{font-size:10px;font-weight:700;color:rgba(255,255,255,.9)}
.pool-s{font-size:8px;color:rgba(255,255,255,.45);margin-top:1px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.dc{background:var(--bg3);border:1px solid var(--border);border-radius:7px;
  padding:7px 9px;transition:all .2s}
.dc:hover{border-color:var(--hub)}
.dc-l{font-size:8px;color:var(--muted);margin-bottom:1px}
.dc-n{font-size:18px;font-weight:900;color:var(--hub);line-height:1}
.dc-s{font-size:7.5px;color:var(--muted);margin-top:1px}
.barbox{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 9px}
.br{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.br:last-child{margin-bottom:0}
.br-l{font-size:8.5px;color:var(--muted);width:40px;flex-shrink:0}
.br-t{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.br-f{height:100%;border-radius:2px;transition:width 1.2s ease}
.br-v{font-size:8.5px;font-weight:700;color:var(--text);width:15px;text-align:right}

.leg{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.leg:last-child{margin-bottom:0}
.leg-d{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.leg-t{font-size:10px;font-weight:600}
.leg-c{font-size:9px;color:var(--muted);margin-left:auto}

.hint{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;color:var(--muted);font-size:10px;
  text-align:center;padding:14px;line-height:1.7}
.hint-i{font-size:20px;opacity:.2}

/* CARD */
#card{position:absolute;z-index:100;background:var(--bg2);
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);width:266px;
  display:none;overflow:hidden;
  animation:cIn .15s cubic-bezier(.34,1.56,.64,1)}
@keyframes cIn{from{transform:scale(.88) translateY(8px);opacity:0}to{transform:scale(1);opacity:1}}
.cstrip{height:3px}
#cbody{padding:13px 13px 11px}
.cx{position:absolute;top:9px;right:10px;background:none;border:none;
  color:var(--muted);font-size:14px;cursor:pointer;padding:3px;border-radius:4px;transition:all .15s}
.cx:hover{background:var(--bg3);color:var(--text)}
.cpil{font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:3px}
.cttl{font-size:14px;font-weight:900;color:var(--text);margin-bottom:5px;line-height:1.2;padding-right:16px}
.cdesc{font-size:10px;color:var(--muted);line-height:1.65;
  margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.cpts{list-style:none}
.cpts li{font-size:10px;color:var(--text);padding:4px 0 4px 11px;
  position:relative;border-bottom:1px solid #0d1a2a;line-height:1.4}
.cpts li:last-child{border-bottom:none}
.cpts li::before{content:'';position:absolute;left:0;top:11px;
  width:4px;height:4px;border-radius:1px;background:var(--bul,#888)}
.crel{margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.crel-t{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.crtags{display:flex;flex-wrap:wrap;gap:3px}
.crtag{font-size:9px;padding:2px 7px;border-radius:4px;border:1px solid;
  cursor:pointer;font-family:inherit;background:transparent;transition:all .15s;font-weight:600}
.crtag:hover{opacity:.7}
#tip{position:fixed;pointer-events:none;z-index:200;
  background:rgba(8,13,20,.95);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:4px 10px;font-size:10px;font-family:inherit;font-weight:600;
  box-shadow:0 3px 12px rgba(0,0,0,.5);display:none;white-space:nowrap}
</style>
</head>
